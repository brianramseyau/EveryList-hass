name: Test

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.4
      - run: ruff format --check custom_components tests
      - run: ruff check custom_components tests

  test:
    name: Test (pytest, 100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements_test.txt
      - run: >
          pytest tests
          --cov=custom_components.everylist
          --cov-branch
          --cov-report=term-missing
